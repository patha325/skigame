name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate resort data and game simulation
        run: npm test
      - name: Validate dependency bootstrap
        run: python3 -m unittest discover -s tests -p "*_test.py"
      - name: Check launcher syntax
        run: python3 -m py_compile launch.py bootstrap.py
